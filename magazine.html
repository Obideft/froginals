{act:"COVER · ISSUE 001",title:"BOEDAW MAGAZIN",lead:"A field guide to the culture that started as a joke, became a movement, and keeps finding new ways to surprise us.",body:"Inside: Doge origins, community legends, streetwear, the FROGINAL expedition, NFTs and the future of the pack.",quote:"MUCH CULTURE. VERY ADVENTURE.",labels:["COVER ART","THE DOGE WORLD","FROGINALS","ISSUE 001","THE PACK"]},
{act:"ACT I · THE CULTURE",title:"IT'S MORE THAN A MEME.",lead:"Doge began with a familiar face and a very internet sense of humour. The community turned that simple spark into a language of its own.",body:"Humour, generosity, creativity and a shared sense of belonging helped Doge travel far beyond a screen. The best part has always been the people who keep the spirit moving.",quote:"A meme is a moment. A culture is what people build around it.",labels:["DOGE CULTURE","MEME HISTORY","INTERNET MOMENT","COMMUNITY ENERGY","THE ICON"]},
{act:"ACT I · THE CULTURE",title:"THE PEOPLE ARE THE LEGEND.",lead:"Every movement has its characters: makers, collectors, artists, builders, jokers and the friends who bring one more friend along.",body:"Doge culture is shaped in conversations, fan art, meetups, posts, experiments and acts of community. There is no single uniform for the pack — just room to make something your own.",quote:"THE PACK RULE: bring good energy, make something, and leave the swamp better than you found it.",labels:["THE COMMUNITY","THE CREATORS","THE COLLECTORS","THE PACK","GOOD ENERGY"]},
{act:"ACT I · THE CULTURE",title:"WEAR YOUR CULTURE.",lead:"Culture doesn't stay inside a timeline. It shows up in the things we make, wear, trade, collect and take into the real world.",body:"FROGINALS turns swamp energy into wearable identity: tees, artwork, collectible designs and playful pieces for people who want to rep the culture out loud. It's not just merch. It's a signal that says: you were here, you get the joke, and you're part of the story.",quote:"FROM THE TIMELINE TO THE STREET.",labels:["FROGINALS LOOKBOOK","T-SHIRT","MERCH DETAIL","STREET STYLE","THE DROP"],links:[["EXPLORE PRODUCTS","product.html"]]},
{act:"ACT II · THE ADVENTURE",title:"WELCOME TO THE DOGE FRONTIER.",lead:"The internet is a big place. Every new tool, community and creative experiment opens another trail to explore.",body:"Some expeditions lead to new friendships. Others lead to a new design, a new project or a technical rabbit hole. The fun is in exploring — and sharing what we learn along the way.",quote:"PACK YOUR CURIOSITY. THE NEXT DISCOVERY IS OUT THERE.",labels:["THE FRONTIER","THE ROAD","NEW DISCOVERY","FIELD GEAR","THE HORIZON"]},
{act:"ACT II · THE ADVENTURE",title:"THE FROGINAL EXPEDITION.",lead:"A frog, a Doge community and a map full of question marks. That's how an expedition starts.",body:"FROGINALS has been exploring ways to give its corner of Doge culture a home: building community spaces, testing tools, experimenting with digital identity and navigating the occasional swamp of DNS settings and blockchain details. Not every route is a straight line. We document the attempts, celebrate the discoveries and keep moving.",quote:"FIELD NOTES FROM THE SWAMP.",labels:["THE EXPEDITION","FIELD NOTES","THE SWAMP MAP","NEXT CHECKPOINT","THE JOURNEY"]},

{act:"ACT III · THE LEGACY",title:"HOW DOGE GROWS.",lead:"A culture grows when people keep making things, welcoming newcomers and passing the best parts forward.",body:"Artists bring new ideas. Builders create useful tools. Collectors support creators. Communities make room for the next generation. Products and events turn online identity into shared experiences. There is no single roadmap for culture. It grows through participation, creativity and time.",quote:"THE NEXT WAVE IS ALREADY HERE.",labels:["THE NEXT WAVE","CREATORS","BUILDERS","NEW FRIENDS","FUTURE CULTURE"]},
{act:"ACT III · THE LEGACY",title:"CULTURE NEEDS A HOME.",lead:"Stories can live in posts, archives, websites, art, clothing, community spaces and the memories people carry with them.",body:"For FROGINALS, that home is a growing universe of pages, products, collectibles and community experiences. A place to discover the story — and add your own chapter.",quote:"A WEBSITE CAN INTRODUCE THE STORY. A COMMUNITY KEEPS IT ALIVE.",labels:["A HOME FOR THE PACK","THE ARCHIVE","THE MEETING PLACE","SHARED STORIES","THE SWAMP"]},
{act:"ACT III · THE LEGACY",title:"NFTs: A WAY TO PRESERVE CULTURE ON-CHAIN.",lead:"An NFT can help attach a lasting, verifiable on-chain record to a piece of art, a collectible or a moment in a community's history.",body:"That record can help document provenance, connect an item to its creator and give collectors a way to show ownership of a token. It can become one piece of a wider cultural archive. But the image, metadata, website and community still matter. Good preservation uses more than one format: keep copies, document the story and make the work accessible.",quote:"ON-CHAIN RECORDS CAN SUPPORT THE ARCHIVE. PEOPLE AND ACCESSIBLE FILES KEEP THE STORY UNDERSTANDABLE.",labels:["CULTURE ON-CHAIN","PROVENANCE","COLLECTOR STORY","DIGITAL ARCHIVE","THE RECORD"]},
