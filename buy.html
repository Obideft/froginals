dding:15px;background:var(--orange);color:#171717;border:2px solid #171717;border-radius:7px;font:9px/1.7 "Press Start 2P";cursor:pointer}.action:disabled{opacity:.55;cursor:wait}.notice{display:none;padding:14px;margin-top:14px;border:1px solid rgba(255,212,71,.35);border-radius:8px;color:#ffe2a0;line-height:1.6;overflow-wrap:anywhere}.notice.show{display:block}.results{display:none;margin-top:16px}.results.show{display:block}.total{white-space:pre-line;padding:13px;background:#091a2c;border:1px solid var(--line);border-radius:8px;line-height:1.8;margin:12px 0}#paypal-button-container{margin-top:16px}.back{display:inline-block;margin-top:20px;color:var(--yellow);font-weight:800;text-decoration:none}@media(max-width:760px){main{grid-template-columns:1fr;margin:22px auto}.visual,.panel{padding:17px}}

<noscript><img height="1" width="1" style="display:none" alt=""

/></noscript>
<header class="top"><a class="brand" href="shop.html">🐸 FROGINALS MERCH</a><a href="shop.html">← BACK TO STORE</a></header>
<main><section class="visual"><img id="productImage" alt="FROGINALS product preview"><div class="gallery-thumbs" id="galleryThumbs" aria-label="Product images"></div><div class="thumb" id="imageCaption">Official Printful product preview</div></section><section class="panel"><div class="eyebrow">THE FROGINAL SWAMP COLLECTION</div><h1 id="productName">LOADING PRODUCT…</h1><p id="productDescription">Choose your available design option and size.</p><div class="price" id="price">—</div>
<div id="variantControls"><div class="field"><label for="variant">Choose product option</label><select id="variant"><option>Loading available variants…</option></select></div></div><div class="field"><label for="quantity">Quantity</label><select id="quantity"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<h2 style="font-size:15px">Shipping details</h2><p>Printful calculates live shipping for your address and selected product.</p>
<div class="grid"><div class="field"><label>Full name *</label><input id="shipName" autocomplete="name"></div><div class="field"><label>Email</label><input id="shipEmail" type="email" autocomplete="email"></div><div class="field" style="grid-column:1/-1"><label>Street address *</label><input id="shipAddress1" autocomplete="address-line1"></div><div class="field" style="grid-column:1/-1"><label>Apartment / suite</label><input id="shipAddress2" autocomplete="address-line2"></div><div class="field"><label>City *</label><input id="shipCity" autocomplete="address-level2"></div><div class="field"><label>State / province</label><input id="shipState" autocomplete="address-level1"></div><div class="field"><label>Postal code</label><input id="shipZip" autocomplete="postal-code"></div><div class="field"><label>Country code *</label><input id="shipCountry" maxlength="2" placeholder="US" autocomplete="country"></div><div class="field" style="grid-column:1/-1"><label>Phone (optional)</label><input id="shipPhone" type="tel" autocomplete="tel"></div></div>
<button class="action" id="calculate">CALCULATE LIVE SHIPPING</button><div class="results" id="results"><div class="field"><label for="shippingMethod">Delivery method</label><select id="shippingMethod"></select></div><div class="total" id="total"></div><div id="paypal-button-container"></div></div><div class="notice" id="notice" role="status" aria-live="polite"></div><a class="back" href="shop.html">← Continue shopping</a></section></main>
<script>
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const productId=params.get("product_id");
let product=null,variants=[],rates=[],paypalPromise=null,paypalFor="",selectedVariantId="",activeCheckoutMeta=null,trackedPurchaseOrder="",lastViewedVariantId="";
const colorSelect=document.createElement("select");
const sizeSelect=document.createElement("select");
const variantSelect=document.createElement("select");
const colorField=document.createElement("div");
const sizeField=document.createElement("div");
const fallbackField=document.createElement("div");
let hasColor=false,hasSize=false;

function note(t){$("notice").textContent=t;$("notice").classList.add("show")}
function pixelTrack(name,params,options){if(typeof window.fbq==="function")window.fbq("track",name,params||{},options||{})}
function productContentId(v){return String(v&&(v.external_id||v.externalId||v.id)||"")}
function trackProductView(){
  const v=selected();if(!v)return;
  const id=productContentId(v);if(!id||id===lastViewedVariantId)return;
  lastViewedVariantId=id;
  pixelTrack("ViewContent",{content_ids:[id],content_type:"product",content_name:$("productName").textContent||"FROGINALS product",value:price(),currency:"USD"});
}
function selected(){return variants.find(v=>String(v.id)===String(selectedVariantId))||variants[0]||null}
function price(){const v=selected();return v?Number(v.retail_price||v.price||0):0}
function optionValue(v,key){
  if(v&&v[key]!==undefined&&v[key]!==null&&String(v[key]).trim())return String(v[key]).trim();
  const opts=v&&v.options;
  if(Array.isArray(opts)){
    const found=opts.find(o=>String(o.id||o.name||"").toLowerCase().includes(key));
    if(found)return String(found.value||found.display_value||"").trim();
  }else if(opts&&typeof opts==="object"){
    const found=Object.entries(opts).find(([k])=>k.toLowerCase().includes(key));
    if(found)return String(found[1]).trim();
  }
  // Printful often stores colour and size in the variant name, e.g. Product / Black / L.
  const parts=String(v&&v.name||"").split(/[\\/|]/).map(x=>x.trim()).filter(Boolean);
  if(parts.length>=2){
    if(key==="size"){
      const candidate=parts[parts.length-1];
      if(/^(2?XS|[2-5]?XL|S|M|L|XL|XXL|XXXL|XXXXL|One Size|OS|\\d+(?:oz|\\s*oz))$/i.test(candidate))return candidate;
    }
    if(key==="color"){
      let candidate=parts[parts.length-2];
      candidate=candidate.replace(/^.*\\s[-–—]\\s/,"").trim();
      if(candidate&&!/^(size|color|colour)$/i.test(candidate))return candidate;
    }
  }
  return "";
}
function uniqueValues(key){
  return [...new Set(variants.map(v=>optionValue(v,key)).filter(Boolean))];
}
function resetCheckout(){
  $("results").classList.remove("show");$("notice").classList.remove("show");
  $("paypal-button-container").innerHTML="";rates=[];paypalFor="";
}
function updatePrice(){
  const p=price()*Number($("quantity").value);
  $("price").textContent=p?"$"+p.toFixed(2)+" USD":"Price unavailable";
  trackProductView();
  resetCheckout();
}
function recipient(){return{name:$("shipName").value.trim(),email:$("shipEmail").value.trim(),address1:$("shipAddress1").value.trim(),address2:$("shipAddress2").value.trim(),city:$("shipCity").value.trim(),state_code:$("shipState").value.trim().toUpperCase(),zip:$("shipZip").value.trim(),country_code:$("shipCountry").value.trim().toUpperCase(),phone:$("shipPhone").value.trim()}}
function makeField(label,select){
  const wrap=document.createElement("div");wrap.className="field";
  const l=document.createElement("label");l.textContent=label;wrap.appendChild(l);wrap.appendChild(select);return wrap;
}
function fillSelect(select,values){
  select.innerHTML="";
  values.forEach(value=>{const o=document.createElement("option");o.value=value;o.textContent=value;select.appendChild(o)});
}
function variantLabel(v){
  const color=optionValue(v,"color"),size=optionValue(v,"size");
  return [color,size].filter(Boolean).join(" / ")||v.name||("Option "+v.id);
}
function renderOptionControls(){
  const colors=uniqueValues("color"),sizes=uniqueValues("size");
  hasColor=colors.length>0;hasSize=sizes.length>0;
  const host=$("variantControls");host.innerHTML="";
  colorField.className="field";sizeField.className="field";fallbackField.className="field";
  colorSelect.id="colorOption";sizeSelect.id="sizeOption";variantSelect.id="variant";
  if(hasColor||hasSize){
    const row=document.createElement("div");row.className="option-row";
    if(hasColor){fillSelect(colorSelect,colors);colorField.replaceChildren();const label=document.createElement("label");label.textContent="Colour / design";colorField.append(label,colorSelect);row.appendChild(colorField)}
    if(hasSize){sizeField.replaceChildren();const label=document.createElement("label");label.textContent="Size";sizeField.append(label,sizeSelect);row.appendChild(sizeField)}
    host.appendChild(row);
    if(!hasColor&&hasSize&&sizes.length===1){sizeField.classList.add("wide")}
    colorSelect.addEventListener("change",()=>{refreshSizes();chooseVariant()});
    sizeSelect.addEventListener("change",chooseVariant);
    refreshSizes();
  }else{
    fillSelect(variantSelect,variants.map(v=>String(v.id)));
    [...variantSelect.options].forEach((o,i)=>o.textContent=variantLabel(variants[i])+" — $"+Number(variants[i].retail_price||variants[i].price||0).toFixed(2));
    const label=document.createElement("label");label.textContent="Choose product option";
    fallbackField.replaceChildren(label,variantSelect);host.appendChild(fallbackField);
    variantSelect.addEventListener("change",()=>{selectedVariantId=variantSelect.value;renderGallery();updatePrice()});
    selectedVariantId=variantSelect.value;
  }
  if(hasColor||hasSize)chooseVariant();
}
function refreshSizes(){
  const color=colorSelect.value;
  const available=variants.filter(v=>!hasColor||optionValue(v,"color")===color);
  const values=[...new Set(available.map(v=>optionValue(v,"size")).filter(Boolean))];
  if(hasSize){fillSelect(sizeSelect,values);sizeSelect.disabled=values.length<2}
}
function chooseVariant(){
  const color=colorSelect.value,size=sizeSelect.value;
  const match=variants.find(v=>(!hasColor||optionValue(v,"color")===color)&&(!hasSize||optionValue(v,"size")===size));
  if(!match)return;
  selectedVariantId=String(match.id);
  renderGallery();updatePrice();
}
function renderGallery(){
  const v=selected();
  if(!v)return;

  // Printful Sync file mapping:
  // - type "preview" = rendered product mockup (the image customers should see)
  // - type "default" = main uploaded artwork
  // - type "label_outside" (and other placements) = print artwork such as the back tag
  // Do not use the visible flag: Printful marks generated preview mockups visible:false.
  const files=Array.isArray(v.files)?v.files:[];
  const mockupFiles=files.filter(f=>
    f &&
    String(f.type||"").toLowerCase()==="preview" &&
    (f.preview_url||f.thumbnail_url)
  );

  const urls=[];
  mockupFiles.forEach(f=>{
    const url=f.preview_url||f.thumbnail_url;
    if(url&&!urls.some(x=>x.url===url)){
      const filename=String(f.filename||"").toLowerCase();
      const angle=filename.includes("back")?"Back":
        filename.includes("side")?"Side":
        filename.includes("front")?"Front":"Mockup";
      urls.push({url,alt:angle});
    }
  });

  // If Printful has no rendered mockup for this exact variant, use its
  // colour-specific catalog garment photo rather than another variant's art.
  if(!urls.length&&v.product&&v.product.image){
    urls.push({url:v.product.image,alt:"Catalog garment photo (mockup unavailable)"});
  }

  const main=$("productImage"),thumbs=$("galleryThumbs");
  thumbs.innerHTML="";
  if(!urls.length){
    main.removeAttribute("src");
    main.alt="No garment mockup available";
    $("imageCaption").textContent="No garment image is available for this variant yet";
    return;
  }
  function show(item,index){
    main.src=item.url;
    main.alt=($("productName").textContent||"FROGINALS product")+" — "+item.alt;
    $("imageCaption").textContent=variantLabel(v)+" · "+item.alt;
    [...thumbs.children].forEach((b,i)=>b.classList.toggle("active",i===index));
  }
  urls.forEach((item,index)=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="gallery-thumb";
    button.setAttribute("aria-label","View "+item.alt+" "+(index+1));
    const image=document.createElement("img");
    image.src=item.url;
    image.alt="";
    image.loading="lazy";
    button.appendChild(image);
    button.addEventListener("click",()=>show(item,index));
    thumbs.appendChild(button);
  });
  show(urls[0],0);
}
async function loadProduct(){
  if(!productId){note("Product link is missing. Return to the store and choose a product.");return}
  try{
    const r=await fetch("/api/printful-products?resource=variants&product_id="+encodeURIComponent(productId));
    const d=await r.json();if(!r.ok)throw Error(d.error||"Could not load product.");
    product=d.result||{};
    const sp=product.sync_product||{};
    variants=(product.sync_variants||[]).filter(v=>v&&v.id!=null&&(v.availability_status? v.availability_status==="active" : v.synced!==false));
    $("productName").textContent=sp.name||"FROGINALS PRODUCT";
    $("productDescription").textContent="Made to order by Printful. Choose from the available colours, sizes and product options below.";
    if(!variants.length)throw Error("No active variants found for this Printful product.");
    renderOptionControls();renderGallery();updatePrice();
  }catch(e){note(e.message||"Product could not be loaded.")}
}
async function calcShipping(){
  const r=recipient();
  if(!r.name||!r.address1||!r.city||!/^[A-Z]{2}$/.test(r.country_code)){note("Enter your name, street address, city and 2-letter country code (for example US, GB or MA).");return}
  if(["US","CA","AU"].includes(r.country_code)&&!r.state_code){note("Enter your state or province.");return}
  const v=selected();if(!v){note("Choose an available product option first.");return}
  const b=$("calculate");b.disabled=true;b.textContent="CALCULATING…";
  try{
    const response=await fetch("/api/printful-shipping-rates",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({variantId:v.id,quantity:Number($("quantity").value),recipient:r})});
    const d=await response.json();if(!response.ok||!Array.isArray(d.rates))throw Error(d.error||"Shipping rates unavailable.");
    rates=d.rates;$("shippingMethod").innerHTML="";
    rates.forEach((x,i)=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name+" — $"+Number(x.rate).toFixed(2)+" USD";$("shippingMethod").appendChild(o);if(!i)o.selected=true});
    $("results").classList.add("show");updateTotal();await renderPayPal();
  }catch(e){note(e.message||"Shipping calculation failed.")}
  finally{b.disabled=false;b.textContent="RECALCULATE LIVE SHIPPING"}
}
function updateTotal(){
  const r=rates.find(x=>x.id===$("shippingMethod").value);
  if(r)$("total").textContent="Product subtotal: $"+(price()*Number($("quantity").value)).toFixed(2)+" USD\nShipping: $"+Number(r.rate).toFixed(2)+" USD\nEstimated total: $"+(price()*Number($("quantity").value)+Number(r.rate)).toFixed(2)+" USD";
}
async function loadPayPal(){
  if(window.paypal)return;if(paypalPromise)return paypalPromise;
  paypalPromise=(async()=>{const r=await fetch("/api/paypal-client-id");const d=await r.json();if(!r.ok||!d.clientId)throw Error(d.error||"PayPal is not configured.");await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://www.paypal.com/sdk/js?client-id="+encodeURIComponent(d.clientId)+"&currency=USD&intent=capture&components=buttons";s.onload=resolve;s.onerror=()=>reject(Error("PayPal could not load."));document.head.appendChild(s)})})();return paypalPromise;
}
async function renderPayPal(){
  const sid=$("shippingMethod").value;if(!sid||paypalFor===sid)return;
  $("paypal-button-container").innerHTML="";paypalFor=sid;
  try{
    await loadPayPal();
    await paypal.Buttons({
      style:{layout:"vertical",color:"gold",shape:"rect",label:"paypal"},
      createOrder:async()=>{
        const v=selected();
        const r=await fetch("/api/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({variantId:v.id,quantity:Number($("quantity").value),recipient:recipient(),shippingId:$("shippingMethod").value})});
        const d=await r.json();if(!r.ok||!d.id)throw Error(d.error||"Could not create PayPal order.");
        $("total").textContent="Product subtotal: $"+(price()*Number($("quantity").value)).toFixed(2)+" USD\nConfirmed shipping: $"+Number(d.shipping).toFixed(2)+" USD\nPayPal total: $"+Number(d.total).toFixed(2)+" USD";
        activeCheckoutMeta={contentId:productContentId(v),contentName:$("productName").textContent||"FROGINALS product",value:Number(d.total||0),quantity:Number($("quantity").value)};
        pixelTrack("InitiateCheckout",{content_ids:activeCheckoutMeta.contentId?[activeCheckoutMeta.contentId]:[],content_type:"product",content_name:activeCheckoutMeta.contentName,value:activeCheckoutMeta.value,currency:"USD",num_items:activeCheckoutMeta.quantity});
        return d.id;
      },
      onApprove:async data=>{
        note("Payment approved. Confirming payment and sending your order to Printful…");
        const r=await fetch("/api/capture-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderID:data.orderID})});
        const d=await r.json();if(!r.ok&&r.status!==202)throw Error(d.error||"Payment confirmation needs attention.");
        if(d.orderID&&d.orderID!==trackedPurchaseOrder){
          const meta=activeCheckoutMeta||{contentId:productContentId(selected()),contentName:$("productName").textContent||"FROGINALS product",value:0,quantity:Number($("quantity").value)};
          pixelTrack("Purchase",{content_ids:meta.contentId?[meta.contentId]:[],content_type:"product",content_name:meta.contentName,value:meta.value,currency:"USD",num_items:meta.quantity},{eventID:"paypal_"+d.orderID});
          trackedPurchaseOrder=d.orderID;
        }
        if(d.fulfillment==="PENDING_RETRY"||d.fulfillment==="PENDING_CONFIGURATION"){note("Payment complete, but Printful fulfillment needs attention. Contact FROGINALS support with PayPal order "+d.orderID+".");return}
        note("Payment successful! 🐸 Your order has been sent to Printful. Order: "+d.orderID+(d.printfulOrderID?" | Printful: "+d.printfulOrderID:""));
      },
      onCancel:()=>note("Checkout cancelled. No payment was taken."),
      onError:e=>note(e?.message||"PayPal checkout error.")
    }).render("#paypal-button-container");
  }catch(e){paypalFor="";note(e.message||"PayPal checkout could not load.")}
}
$("quantity").addEventListener("change",updatePrice);
$("calculate").addEventListener("click",calcShipping);
$("shippingMethod").addEventListener("change",()=>{$("paypal-button-container").innerHTML="";paypalFor="";updateTotal();renderPayPal()});
loadProduct();
</script></body></html>
