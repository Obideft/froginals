<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Buy FROGINALS Merch</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#071426;--panel:#102945;--orange:#ff7900;--yellow:#ffd447;--muted:#a8bad0;--line:rgba(153,190,230,.2)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f7ff;font-family:"Space Grotesk",sans-serif}.top{padding:12px 5%;background:#050f1d;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:10px/1.7 "Press Start 2P";color:var(--yellow);text-decoration:none}.top a:last-child{color:var(--yellow);font-weight:800;text-decoration:none}main{width:min(1100px,92%);margin:42px auto;display:grid;grid-template-columns:1fr 1fr;gap:36px}.visual,.panel{background:linear-gradient(145deg,#102945,#0b1d32);border:1px solid var(--line);border-radius:16px;padding:24px}.visual{display:grid;align-content:start;gap:15px}.visual img{width:100%;max-height:570px;object-fit:contain;border-radius:10px;background:#0a1b30}.visual .thumb{color:var(--muted);font-size:12px}.eyebrow{font:9px/2 "Press Start 2P";color:var(--orange)}h1{font:clamp(20px,3vw,34px)/1.5 "Press Start 2P";margin:10px 0}p{color:var(--muted);line-height:1.7}.price{font-size:30px;font-weight:900;color:var(--yellow);margin:16px 0}.field{margin:18px 0}.field label{display:block;color:#c6d6e8;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}.field select,.field input{width:100%;padding:13px;background:#08182a;color:white;border:1px solid var(--line);border-radius:7px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{width:100%;padding:15px;background:var(--orange);color:#171717;border:2px solid #171717;border-radius:7px;font:9px/1.7 "Press Start 2P";cursor:pointer}.action:disabled{opacity:.55;cursor:wait}.notice{display:none;padding:14px;margin-top:14px;border:1px solid rgba(255,212,71,.35);border-radius:8px;color:#ffe2a0;line-height:1.6;overflow-wrap:anywhere}.notice.show{display:block}.results{display:none;margin-top:16px}.results.show{display:block}.total{white-space:pre-line;padding:13px;background:#091a2c;border:1px solid var(--line);border-radius:8px;line-height:1.8;margin:12px 0}#paypal-button-container{margin-top:16px}.back{display:inline-block;margin-top:20px;color:var(--yellow);font-weight:800;text-decoration:none}@media(max-width:760px){main{grid-template-columns:1fr;margin:22px auto}.visual,.panel{padding:17px}}
</style></head><body><header class="top"><a class="brand" href="shop.html">🐸 FROGINALS MERCH</a><a href="shop.html">← BACK TO STORE</a></header>
<main><section class="visual"><img id="productImage" alt="FROGINALS product preview"><div class="thumb" id="imageCaption">Official Printful product preview</div></section><section class="panel"><div class="eyebrow">THE FROGINAL SWAMP COLLECTION</div><h1 id="productName">LOADING PRODUCT…</h1><p id="productDescription">Choose your available design option and size.</p><div class="price" id="price">—</div>
<div class="field"><label for="variant">Choose colour / size</label><select id="variant"><option>Loading available variants…</option></select></div><div class="field"><label for="quantity">Quantity</label><select id="quantity"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
<h2 style="font-size:15px">Shipping details</h2><p>Printful calculates live shipping for your address and selected product.</p>
<div class="grid"><div class="field"><label>Full name *</label><input id="shipName" autocomplete="name"></div><div class="field"><label>Email</label><input id="shipEmail" type="email" autocomplete="email"></div><div class="field" style="grid-column:1/-1"><label>Street address *</label><input id="shipAddress1" autocomplete="address-line1"></div><div class="field" style="grid-column:1/-1"><label>Apartment / suite</label><input id="shipAddress2" autocomplete="address-line2"></div><div class="field"><label>City *</label><input id="shipCity" autocomplete="address-level2"></div><div class="field"><label>State / province</label><input id="shipState" autocomplete="address-level1"></div><div class="field"><label>Postal code</label><input id="shipZip" autocomplete="postal-code"></div><div class="field"><label>Country code *</label><input id="shipCountry" maxlength="2" placeholder="US" autocomplete="country"></div><div class="field" style="grid-column:1/-1"><label>Phone (optional)</label><input id="shipPhone" type="tel" autocomplete="tel"></div></div>
<button class="action" id="calculate">CALCULATE LIVE SHIPPING</button><div class="results" id="results"><div class="field"><label for="shippingMethod">Delivery method</label><select id="shippingMethod"></select></div><div class="total" id="total"></div><div id="paypal-button-container"></div></div><div class="notice" id="notice" role="status" aria-live="polite"></div><a class="back" href="shop.html">← Continue shopping</a></section></main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);const productId=params.get("product_id");let product=null,variants=[],rates=[],paypalPromise=null,paypalFor="";
function note(t){$("notice").textContent=t;$("notice").classList.add("show")}
function selected(){return variants.find(v=>String(v.id)===$("variant").value)}
function price(){const v=selected();if(!v)return 0;return Number(v.retail_price||v.price||0)}
function updatePrice(){const p=price()*Number($("quantity").value);$("price").textContent=p?"$"+p.toFixed(2)+" USD":"Price unavailable";$("results").classList.remove("show");$("notice").classList.remove("show");$("paypal-button-container").innerHTML="";rates=[];paypalFor=""}
function recipient(){return{name:$("shipName").value.trim(),email:$("shipEmail").value.trim(),address1:$("shipAddress1").value.trim(),address2:$("shipAddress2").value.trim(),city:$("shipCity").value.trim(),state_code:$("shipState").value.trim().toUpperCase(),zip:$("shipZip").value.trim(),country_code:$("shipCountry").value.trim().toUpperCase(),phone:$("shipPhone").value.trim()}}
async function loadProduct(){if(!productId){note("Product link is missing. Return to the store and choose a product.");return}try{const r=await fetch("/api/printful-products?resource=variants&product_id="+encodeURIComponent(productId));const d=await r.json();if(!r.ok)throw Error(d.error||"Could not load product.");product=d.result||{};variants=product.sync_variants||[];const sp=product.sync_product||{};$("productName").textContent=sp.name||"FROGINALS PRODUCT";$("productDescription").textContent="Made to order by Printful. Select an available option and enter your shipping address to see delivery prices.";const image=sp.thumbnail_url||(variants[0]?.files||[]).find(f=>f.type==="preview")?.preview_url||"";$("productImage").src=image;$("productImage").alt=sp.name||"FROGINALS product";$("imageCaption").textContent=sp.name||"FROGINALS product";if(!variants.length)throw Error("No active variants found for this Printful product.");$("variant").innerHTML="";variants.forEach(v=>{const o=document.createElement("option");o.value=v.id;const color=v.color||"",size=v.size||v.name||"";o.textContent=[color,size].filter(Boolean).join(" / ")+" — $"+Number(v.retail_price||v.price||0).toFixed(2);$("variant").appendChild(o)});updatePrice()}catch(e){note(e.message||"Product could not be loaded.")}}
async function calcShipping(){const r=recipient();if(!r.name||!r.address1||!r.city||!/^[A-Z]{2}$/.test(r.country_code)){note("Enter your name, street address, city and 2-letter country code (for example US, GB or MA).");return}if(["US","CA","AU"].includes(r.country_code)&&!r.state_code){note("Enter your state or province.");return}const b=$("calculate");b.disabled=true;b.textContent="CALCULATING…";$("notice").classList.remove("show");try{const response=await fetch("/api/printful-shipping-rates",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({variantId:selected().id,quantity:Number($("quantity").value),recipient:r})});const d=await response.json();if(!response.ok||!Array.isArray(d.rates))throw Error(d.error||"Shipping rates unavailable.");rates=d.rates;$("shippingMethod").innerHTML="";rates.forEach((x,i)=>{const o=document.createElement("option");o.value=x.id;o.textContent=x.name+" — $"+Number(x.rate).toFixed(2)+" USD";$("shippingMethod").appendChild(o);if(!i)o.selected=true});$("results").classList.add("show");updateTotal();await renderPayPal()}catch(e){note(e.message||"Shipping calculation failed.")}finally{b.disabled=false;b.textContent="RECALCULATE LIVE SHIPPING"}}
function updateTotal(){const r=rates.find(x=>x.id===$("shippingMethod").value);if(r)$("total").textContent="Product subtotal: $"+(price()*Number($("quantity").value)).toFixed(2)+" USD\nShipping: $"+Number(r.rate).toFixed(2)+" USD\nEstimated total: $"+(price()*Number($("quantity").value)+Number(r.rate)).toFixed(2)+" USD"}
async function loadPayPal(){if(window.paypal)return;if(paypalPromise)return paypalPromise;paypalPromise=(async()=>{const r=await fetch("/api/paypal-client-id");const d=await r.json();if(!r.ok||!d.clientId)throw Error(d.error||"PayPal is not configured.");await new Promise((resolve,reject)=>{const s=document.createElement("script");s.src="https://www.paypal.com/sdk/js?client-id="+encodeURIComponent(d.clientId)+"&currency=USD&intent=capture&components=buttons";s.onload=resolve;s.onerror=()=>reject(Error("PayPal could not load."));document.head.appendChild(s)})})();return paypalPromise}
async function renderPayPal(){const sid=$("shippingMethod").value;if(!sid||paypalFor===sid)return;$("paypal-button-container").innerHTML="";paypalFor=sid;try{await loadPayPal();await paypal.Buttons({style:{layout:"vertical",color:"gold",shape:"rect",label:"paypal"},createOrder:async()=>{const r=await fetch("/api/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({variantId:selected().id,quantity:Number($("quantity").value),recipient:recipient(),shippingId:$("shippingMethod").value})});const d=await r.json();if(!r.ok||!d.id)throw Error(d.error||"Could not create PayPal order.");$("total").textContent="Product subtotal: $"+(price()*Number($("quantity").value)).toFixed(2)+" USD\nConfirmed shipping: $"+Number(d.shipping).toFixed(2)+" USD\nPayPal total: $"+Number(d.total).toFixed(2)+" USD";return d.id},onApprove:async data=>{note("Payment approved. Confirming payment and sending your order to Printful…");const r=await fetch("/api/capture-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderID:data.orderID})});const d=await r.json();if(!r.ok&&r.status!==202)throw Error(d.error||"Payment confirmation needs attention.");if(d.fulfillment==="PENDING_RETRY"||d.fulfillment==="PENDING_CONFIGURATION"){note("Payment complete, but Printful fulfillment needs attention. Contact FROGINALS support with PayPal order "+d.orderID+".");return}note("Payment successful! 🐸 Your order has been sent to Printful. Order: "+d.orderID+(d.printfulOrderID?" | Printful: "+d.printfulOrderID:""))},onCancel:()=>note("Checkout cancelled. No payment was taken."),onError:e=>note(e?.message||"PayPal checkout error.")}).render("#paypal-button-container")}catch(e){paypalFor="";note(e.message||"PayPal checkout could not load.")}}
$("variant").addEventListener("change",updatePrice);$("quantity").addEventListener("change",updatePrice);$("calculate").addEventListener("click",calcShipping);$("shippingMethod").addEventListener("change",()=>{paypalFor="";$("paypal-button-container").innerHTML="";updateTotal();renderPayPal()});loadProduct();
</script></body></html>
