
<script>
  const COMMUNITY_FEED_URL = "./data/community.json";
  const FETCH_TIMEOUT_MS = 15000;

  const track = document.getElementById("carouselTrack");
  const status = document.getElementById("galleryStatus");
  const counter = document.getElementById("carouselCounter");
  const previousButton = document.getElementById("previousButton");
  const nextButton = document.getElementById("nextButton");
  const controls = document.getElementById("carouselControls");
  const emptyState = document.getElementById("emptyState");
  const emptyTitle = document.getElementById("emptyTitle");
  const emptyMessage = document.getElementById("emptyMessage");
  const retryButton = document.getElementById("retryButton");

  let cards = [];
  let activeIndex = 0;
  let requestNumber = 0;
  let scrollFrame = null;

  function safeUrl(value) {
    if (typeof value !== "string" || !value.trim()) return null;

    try {
      const url = new URL(value.trim(), document.baseURI);
      return ["https:", "http:"].includes(url.protocol)
        ? url.href
        : null;
    } catch {
      return null;
    }
  }

  function normalizeFeed(data) {
    const entries = Array.isArray(data)
      ? data
      : Array.isArray(data?.images)
        ? data.images
        : Array.isArray(data?.items)
          ? data.items
          : [];

    return entries.map((item) => {
      if (typeof item === "string") {
        return {
          image: safeUrl(item),
          title: "FROGINALS COMMUNITY",
          caption: "Another legendary frog moment.",
          alt: "FROGINALS community artwork",
          url: null
        };
      }

      if (!item || typeof item !== "object") return null;

      return {
        image: safeUrl(item.image || item.imageUrl || item.src),
        title: String(
          item.title || item.name || "FROGINALS COMMUNITY"
        ).slice(0, 140),
        caption: String(
          item.caption || item.description ||
          "Another legendary frog moment."
        ).slice(0, 500),
        alt: String(
          item.alt || item.title || item.name ||
          "FROGINALS community artwork"
        ).slice(0, 250),
        url: safeUrl(item.url || item.postUrl)
      };
    }).filter(item => item && item.image);
  }

  function updateCounter() {
    if (!cards.length) {
      counter.textContent = "00 / 00";
      previousButton.disabled = true;
      nextButton.disabled = true;
      return;
    }

    const trackLeft = track.getBoundingClientRect().left;
    let closestDistance = Infinity;
    let closestIndex = 0;

    cards.forEach((card, index) => {
      const distance = Math.abs(
        card.getBoundingClientRect().left - trackLeft
      );

      if (distance < closestDistance) {
        closestDistance = distance;
        closestIndex = index;
      }
    });

    activeIndex = closestIndex;

    counter.textContent =
      String(activeIndex + 1).padStart(2, "0") +
      " / " +
      String(cards.length).padStart(2, "0");

    previousButton.disabled = activeIndex === 0;
    nextButton.disabled = activeIndex === cards.length - 1;
  }

  function goToCard(index) {
    if (!cards.length) return;

    const target = Math.max(
      0,
      Math.min(cards.length - 1, index)
    );

    cards[target].scrollIntoView({
      behavior: window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches ? "auto" : "smooth",
      block: "nearest",
      inline: "start"
    });

    activeIndex = target;
    updateCounter();
  }

  previousButton.addEventListener("click", () => {
    goToCard(activeIndex - 1);
  });

  nextButton.addEventListener("click", () => {
    goToCard(activeIndex + 1);
  });

  track.addEventListener("scroll", () => {
    if (scrollFrame !== null) {
      cancelAnimationFrame(scrollFrame);
    }

    scrollFrame = requestAnimationFrame(() => {
      updateCounter();
      scrollFrame = null;
    });
  }, { passive: true });

  track.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") {
      event.preventDefault();
      goToCard(activeIndex + 1);
    }

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      goToCard(activeIndex - 1);
    }
  });

  window.addEventListener("resize", updateCounter);

  function showEmptyState(title, message) {
    track.replaceChildren();
    track.classList.add("hidden");
    controls.classList.add("hidden");
    emptyState.classList.remove("hidden");

    emptyTitle.textContent = title;
    emptyMessage.textContent = message;
    status.textContent = message;

    cards = [];
    activeIndex = 0;
    updateCounter();
  }

  function createCard(item, index, onLoad, onError) {
    const card = document.createElement("article");
    card.className = "gallery-card";

    const imageWrap = document.createElement("div");
    imageWrap.className = "image-wrap";

    const img = document.createElement("img");
    img.className = "gallery-image";
    img.alt = item.alt;
    img.loading = index < 2 ? "eager" : "lazy";
    img.decoding = "async";
    img.draggable = false;

    // Attach event listeners BEFORE assigning the image URL.
    img.addEventListener("load", () => {
      if (img.naturalWidth > 0) onLoad(card);
      else onError(card);
    }, { once: true });

    img.addEventListener("error", () => {
      onError(card);
    }, { once: true });

    imageWrap.appendChild(img);

    if (item.url) {
      const link = document.createElement("a");
      link.className = "image-link";
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute(
        "aria-label",
        "Open original community post"
      );

      link.appendChild(imageWrap);
      card.appendChild(link);
    } else {
      card.appendChild(imageWrap);
    }

    const caption = document.createElement("div");
    caption.className = "card-caption";

    const title = document.createElement("h3");
    title.textContent = item.title;

    const description = document.createElement("p");
    description.textContent = item.caption;

    caption.append(title, description);
    card.appendChild(caption);

    // Return the image so its URL can be assigned after insertion.
    return { card, img, imageUrl: item.image };
  }

  async function loadCommunityGallery() {
    const currentRequest = ++requestNumber;
    const controller = new AbortController();

    const timeout = setTimeout(
      () => controller.abort(),
      FETCH_TIMEOUT_MS
    );

    status.textContent = "FETCHING FROG ART...";
    emptyState.classList.add("hidden");
    track.classList.remove("hidden");
    controls.classList.add("hidden");
    track.replaceChildren();

    cards = [];
    activeIndex = 0;

    try {
      const feedUrl = new URL(
        COMMUNITY_FEED_URL,
        window.location.href
      );

      feedUrl.searchParams.set("_refresh", Date.now());

      const response = await fetch(feedUrl.href, {
        headers: { Accept: "application/json" },
        cache: "no-store",
        signal: controller.signal
      });

      if (!response.ok) {
        throw new Error(
          "JSON request failed: HTTP " + response.status +
          " — " + feedUrl.href
        );
      }

      const data = await response.json();

      if (currentRequest !== requestNumber) return;

      const images = normalizeFeed(data);

      if (!images.length) {
        showEmptyState(
          "NO FROG ART YET",
          "The JSON loaded, but no valid image URLs were found. Check the images array in data/community.json."
        );
        return;
      }

      let loadedCount = 0;
      let failedCount = 0;
      let finishedCount = 0;
      const failedCards = new Set();

      function refreshStatus() {
        if (currentRequest !== requestNumber) return;

        if (finishedCount < images.length) {
          status.textContent =
            "LOADING FROG ART... " +
            finishedCount + " / " + images.length;
          return;
        }

        if (cards.length) {
          status.textContent =
            loadedCount + (loadedCount === 1
              ? " COMMUNITY IMAGE LOADED"
              : " COMMUNITY IMAGES LOADED") +
            (failedCount
              ? " · " + failedCount + " IMAGE(S) SKIPPED"
              : "");

          updateCounter();
        }
      }

      function onLoad(card) {
        if (currentRequest !== requestNumber) return;
        if (failedCards.has(card)) return;

        loadedCount++;
        finishedCount++;
        refreshStatus();
      }

      function onError(card) {
        if (currentRequest !== requestNumber) return;
        if (failedCards.has(card)) return;

        failedCards.add(card);
        failedCount++;
        finishedCount++;

        card.remove();
        cards = cards.filter(existing => existing !== card);

        if (!cards.length && finishedCount >= images.length) {
          showEmptyState(
            "NO IMAGES FOUND 🐸",
            "The JSON loaded, but none of the image URLs could be displayed. Check the image URLs and try again."
          );
          return;
        }

        refreshStatus();
      }

      const preparedCards = images.map((item, index) =>
        createCard(item, index, onLoad, onError)
      );

      preparedCards.forEach(({ card }) => {
        cards.push(card);
        track.appendChild(card);
      });

      track.scrollLeft = 0;
      controls.classList.remove("hidden");
      updateCounter();

      status.textContent = "LOADING " + images.length +
        (images.length === 1
          ? " COMMUNITY IMAGE..."
          : " COMMUNITY IMAGES...");

      // Start loading only after listeners and cards are ready.
      preparedCards.forEach(({ img, imageUrl }) => {
        img.src = imageUrl;

        // Handle images already resolved by the browser cache.
        if (img.complete) {
          if (img.naturalWidth > 0) {
            onLoad(img.closest(".gallery-card"));
          } else {
            onError(img.closest(".gallery-card"));
          }
        }
      });

    } catch (error) {
      if (currentRequest !== requestNumber) return;

      console.error("FROGINALS gallery error:", error);

      const message = error.name === "AbortError"
        ? "The JSON request timed out. Please try again."
        : "Could not load the JSON feed. Check the deployed data/community.json file and browser console.";

      showEmptyState("CONNECTION LOST 🐸", message);
    } finally {
      clearTimeout(timeout);
    }
  }

  retryButton.addEventListener("click", loadCommunityGallery);

  loadCommunityGallery();
</script>
