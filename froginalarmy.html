
<script>
(() => {
  'use strict';

  // FROGINALS backend hosted on Vercel.
  const API_BASE = 'https://froginals-nu.vercel.app';

  const $ = id => document.getElementById(id);
  const grid = $('memberGrid');
  const search = $('search');
  const empty = $('empty');
  const status = $('verifyStatus');
  const form = $('verifyForm');
  const verifyButton = $('verifyButton');

  let members = [];

  function safeHttpUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === 'https:' ? url.href : null;
    } catch {
      return null;
    }
  }

  function shortWallet(wallet) {
    return wallet.length < 15
      ? wallet
      : wallet.slice(0, 6) + '...' + wallet.slice(-5);
  }

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function link(text, href, cls) {
    const anchor = el('a', cls, text);
    anchor.href = href;
    anchor.target = '_blank';
    anchor.rel = 'noopener noreferrer';
    return anchor;
  }

  // Safely parse API responses, including non-JSON error responses.
  async function readApiResponse(response) {
    const text = await response.text();

    let data = {};
    try {
      data = text ? JSON.parse(text) : {};
    } catch {
      data = {};
    }

    if (!response.ok) {
      throw new Error(
        data.error || `Server returned HTTP ${response.status}.`
      );
    }

    return data;
  }

  function renderMembers() {
    const query = search.value.trim().toLowerCase();

    const shown = members.filter(member =>
      (member.nft_name || '').toLowerCase().includes(query) ||
      (member.wallet_address || '').toLowerCase().includes(query)
    );

    grid.replaceChildren();
    $('memberCount').textContent = String(members.length);

    empty.style.display = shown.length ? 'none' : 'block';
    $('emptyText').textContent = query
      ? 'No verified members match your search.'
      : 'No verified members yet. Be the first to join the Army.';

    shown.forEach(member => {
      const card = el('article', 'member');
      const wrap = el('div', 'nft-wrap');

      wrap.appendChild(
        el('span', 'member-badge', 'VERIFIED HOLDER')
      );

      const imageUrl = safeHttpUrl(member.nft_image_url);

      if (imageUrl) {
        const image = el('img');
        image.src = imageUrl;
        image.alt = member.nft_name || 'Verified FROGINAL DOGS NFT';
        image.loading = 'lazy';
        image.referrerPolicy = 'no-referrer';

        image.onerror = () => {
          image.remove();
          wrap.appendChild(el('div', 'nft-placeholder', '🐸'));
        };

        wrap.appendChild(image);
      } else {
        wrap.appendChild(el('div', 'nft-placeholder', '🐸'));
      }

      const body = el('div', 'member-body');

      body.appendChild(
        el('div', 'member-name', member.nft_name || 'FROGINAL DOGS HOLDER')
      );
      body.appendChild(
        el('div', 'handle', 'OFFICIAL FROGINALARMY MEMBER')
      );
      body.appendChild(
        el(
          'div',
          'wallet',
          'WALLET: ' + shortWallet(member.wallet_address || '')
        )
      );

      const actions = el('div', 'member-actions');

      if (member.wallet_address) {
        actions.appendChild(
          link(
            'VIEW WALLET ↗',
            'https://solscan.io/account/' +
              encodeURIComponent(member.wallet_address),
            'btn'
          )
        );
      }

      if (imageUrl) {
        actions.appendChild(
          link('VIEW NFT IMAGE ↗', imageUrl, 'btn btn-orange')
        );
      }

      body.appendChild(actions);
      card.append(wrap, body);
      grid.appendChild(card);
    });
  }

  // Load the shared member directory from Vercel, not GitHub Pages.
  async function loadMembers() {
    const button = $('refreshMembers');

    button.disabled = true;
    button.textContent = '↻ LOADING...';

    try {
      const response = await fetch(
        `${API_BASE}/api/froginalarmy-members`,
        {
          method: 'GET',
          headers: { Accept: 'application/json' },
          cache: 'no-store'
        }
      );

      const data = await readApiResponse(response);

      if (data.success !== true) {
        throw new Error(
          data.error || 'The member directory is temporarily unavailable.'
        );
      }

      members = Array.isArray(data.members) ? data.members : [];
      renderMembers();
    } catch (error) {
      grid.replaceChildren();
      $('memberCount').textContent = '—';
      empty.style.display = 'block';
      $('emptyText').textContent =
        'Could not load the member directory. Please refresh in a moment.';

      console.error('FROGINALARMY member directory error:', error);
    } finally {
      button.disabled = false;
      button.textContent = '↻ REFRESH MEMBERS';
    }
  }

  // Verify a public Solana wallet using the Vercel backend.
  form.addEventListener('submit', async event => {
    event.preventDefault();

    const wallet = $('walletAddress').value.trim();

    if (!wallet) {
      status.className = 'gate-status error';
      status.textContent = 'Please enter your public Solana wallet address.';
      return;
    }

    status.className = 'gate-status';
    status.textContent =
      'Checking wallet ownership with the verification server...';

    verifyButton.disabled = true;
    verifyButton.textContent = 'VERIFYING...';

    try {
      const response = await fetch(
        `${API_BASE}/api/verify-froginal-holder`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json'
          },
          body: JSON.stringify({
            wallet_address: wallet
          })
        }
      );

      const data = await readApiResponse(response);

      if (data.success !== true) {
        throw new Error(
          data.error || 'The server could not verify this wallet.'
        );
      }

      status.className = 'gate-status success';
      status.textContent = data.already_member
        ? 'This wallet is already a verified FROGINALARMY member. 🐸'
        : 'Verified! Your FROGINAL DOGS ownership is confirmed and you are now in the Army. 🐸🧡';

      await loadMembers();

    } catch (error) {
      status.className = 'gate-status error';

      if (error instanceof TypeError) {
        status.textContent =
          'Could not connect to the verification server. Check the backend CORS settings and try again.';
      } else {
        status.textContent =
          error.message || 'Verification failed. Please try again later.';
      }

      console.error('FROGINALARMY verification error:', error);

    } finally {
      verifyButton.disabled = false;
      verifyButton.textContent = 'VERIFY & JOIN THE ARMY';
    }
  });

  search.addEventListener('input', renderMembers);
  $('refreshMembers').addEventListener('click', loadMembers);

  loadMembers();

  /* LIVE GRAVEMARKET LISTINGS */
  const MARKET_API =
    'https://api.solanadeads.com/gravemarket/v1/collections/7b265fa3-c77d-4a2a-aa27-656900136b52/items?limit=50';

  const marketGrid = $('marketGrid');
  const marketStatus = $('marketStatus');
  const refreshMarketButton = $('refreshMarket');

  function marketElement(tag, cls, text) {
    return el(tag, cls, text);
  }

  function marketLink(label, url, cls) {
    return link(label, url, cls);
  }

  function showMarketMessage(type, heading, detail) {
    marketGrid.replaceChildren();

    const box = marketElement(type, '', '');
    box.appendChild(marketElement('strong', '', heading));
    box.appendChild(document.createTextNode(detail));

    marketGrid.appendChild(box);
  }

  function formatPrice(price, currency) {
    const amount = Number(price);

    if (!Number.isFinite(amount) || amount <= 0) return null;

    return new Intl.NumberFormat('en-US', {
      maximumFractionDigits: 6
    }).format(amount) + ' ' + String(currency || 'SOL').toUpperCase();
  }

  function createMarketCard(nft) {
    const card = marketElement('article', 'market-card');
    const wrap = marketElement('div', 'market-image-wrap');

    const imageUrl =
      safeHttpUrl(nft.thumbnail_url) ||
      safeHttpUrl(nft.image_url);

    if (imageUrl) {
      const image = marketElement('img', 'market-image');
      image.src = imageUrl;
      image.alt = nft.name || 'Froginal Dogs NFT';
      image.loading = 'lazy';
      image.referrerPolicy = 'no-referrer';

      image.addEventListener('error', () => {
        image.remove();
        wrap.appendChild(marketElement('div', 'nft-placeholder', '🐸'));
      }, { once: true });

      wrap.appendChild(image);
    } else {
      wrap.appendChild(marketElement('div', 'nft-placeholder', '🐸'));
    }

    wrap.appendChild(
      marketElement('span', 'market-listing-badge', 'LIVE LISTING')
    );

    const body = marketElement('div', 'market-card-body');

    body.appendChild(
      marketElement('h3', 'market-nft-name', nft.name || 'Froginal Dogs')
    );
    body.appendChild(
      marketElement('div', 'market-price-label', 'ASKING PRICE')
    );
    body.appendChild(
      marketElement(
        'div',
        'market-price',
        formatPrice(nft.listing_price, nft.listing_currency) ||
          'Price unavailable'
      )
    );

    const meta = marketElement('div', 'market-meta');

    meta.appendChild(
      marketElement(
        'span',
        'market-marketplace',
        nft.listing_marketplace || 'Marketplace listing'
      )
    );

    if (Number.isFinite(Number(nft.token_id_numeric))) {
      meta.appendChild(
        marketElement('span', '', '#' + nft.token_id_numeric)
      );
    }

    body.appendChild(meta);

    const actions = marketElement('div', 'market-actions');

    actions.appendChild(
      marketLink(
        'VIEW COLLECTION ↗',
        'https://gravemarket.io/7b265fa3-c77d-4a2a-aa27-656900136b52',
        'btn btn-orange'
      )
    );

    if (imageUrl) {
      actions.appendChild(marketLink('VIEW IMAGE ↗', imageUrl, 'btn'));
    }

    body.appendChild(actions);
    card.append(wrap, body);

    return card;
  }

  async function loadMarketListings() {
    refreshMarketButton.disabled = true;
    refreshMarketButton.textContent = '↻ LOADING...';

    marketStatus.textContent =
      'Fetching live listing data from Gravemarket...';

    showMarketMessage(
      'market-loading',
      '🐸 LOADING THE FROGS...',
      'Fetching current listings.'
    );

    try {
      const response = await fetch(MARKET_API, {
        method: 'GET',
        headers: { Accept: 'application/json' },
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error(
          'Gravemarket returned HTTP ' + response.status + '.'
        );
      }

      const payload = await response.json();

      if (payload.success !== true) {
        throw new Error(
          'The marketplace API did not return a successful response.'
        );
      }

      const allItems = Array.isArray(payload.data?.data)
        ? payload.data.data
        : [];

      const listings = allItems.filter(item =>
        item &&
        !item.is_burned &&
        item.listing_price !== null &&
        item.listing_price !== undefined &&
        item.listing_price !== '' &&
        Number.isFinite(Number(item.listing_price)) &&
        Number(item.listing_price) > 0 &&
        typeof item.listing_currency === 'string' &&
        item.listing_currency.length > 0
      );

      marketGrid.replaceChildren();

      if (!listings.length) {
        showMarketMessage(
          'market-empty',
          'NO ACTIVE LISTINGS RIGHT NOW 🐸',
          'No priced listings were returned for this collection. Check back soon or open the collection page.'
        );

        marketStatus.textContent =
          '0 active listings found in the latest API response.';

        return;
      }

      listings.forEach(nft => {
        marketGrid.appendChild(createMarketCard(nft));
      });

      marketStatus.replaceChildren();
      marketStatus.appendChild(marketElement('span', 'status-dot', ''));
      marketStatus.appendChild(document.createTextNode(' '));
      marketStatus.appendChild(
        marketElement(
          'strong',
          '',
          listings.length + ' ACTIVE LISTING' +
            (listings.length === 1 ? '' : 'S')
        )
      );
      marketStatus.appendChild(
        document.createTextNode(' · Live data from Gravemarket')
      );

    } catch (error) {
      console.error('FROGINAL DOGS marketplace error:', error);

      showMarketMessage(
        'market-error',
        "COULDN'T LOAD THE MARKETPLACE",
        'The live feed could not be reached. The API may block browser requests or be temporarily unavailable. Use the collection link to view listings directly.'
      );

      marketStatus.textContent = 'Marketplace feed unavailable.';

    } finally {
      refreshMarketButton.disabled = false;
      refreshMarketButton.textContent = '↻ REFRESH LISTINGS';
    }
  }

  refreshMarketButton.addEventListener('click', loadMarketListings);
  loadMarketListings();

})();
</script>
