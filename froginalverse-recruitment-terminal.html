
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#858d51">
<title>FROGINALVERSE — RECRUITMENT TERMINAL</title>

<style>
:root {
  --khaki: #858d51;
  --orange: #ff792e;
  --cream: #f4f0d9;
  --dark: #22291c;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background: var(--khaki);
  color: var(--cream);
  font-family: "Courier New", monospace;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: .22;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(20, 25, 15, .45) 4px
  );
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 11;
  pointer-events: none;
  opacity: .12;
  background: repeating-linear-gradient(
    90deg,
    transparent 0,
    transparent 8px,
    rgba(255,255,255,.12) 9px
  );
  animation: flicker .12s infinite;
}

@keyframes flicker {
  0%, 100% { opacity: .09; }
  50% { opacity: .16; }
}

.terminal {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 100svh;
  padding: 28px 20px 36px;
  text-align: center;
}

.topline {
  position: absolute;
  top: 24px;
  left: 26px;
  right: 26px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--dark);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 2px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.status::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #d6ff76;
  box-shadow: 0 0 10px #d6ff76;
}

h1 {
  position: relative;
  z-index: 1;
  margin: 36px 0 5px;
  color: var(--cream);
  font-size: clamp(26px, 5vw, 54px);
  line-height: 1;
  letter-spacing: clamp(1px, .6vw, 6px);
  font-weight: 900;
  text-shadow: 3px 3px 0 rgba(37, 44, 25, .4);
}

.subtitle {
  margin: 10px 0 0;
  color: var(--dark);
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 4px;
}

.character-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(100%, 510px);
  height: clamp(280px, 45vh, 440px);
  margin: 8px 0;
}

.character-stage::before {
  content: "";
  position: absolute;
  width: 74%;
  height: 74%;
  border: 1px solid rgba(244, 240, 217, .35);
  border-radius: 50%;
  box-shadow: 0 0 50px rgba(35, 42, 24, .12);
}

.character-stage::after {
  content: "FROGINAL ARMY • RECRUIT • DEPLOY";
  position: absolute;
  bottom: 7px;
  color: var(--dark);
  font-size: 9px;
  letter-spacing: 2px;
}

.frog {
  position: relative;
  z-index: 2;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 14px 0 rgba(31, 38, 23, .12));
  animation: float 3s ease-in-out infinite, glitch 7s infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes glitch {
  0%, 93%, 100% { opacity: 1; }
  94% { opacity: .75; transform: translateX(2px); }
  95% { opacity: 1; transform: translateX(-2px); }
  96% { opacity: .9; transform: translateX(0); }
}

.actions {
  position: relative;
  z-index: 12;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
  width: min(100%, 360px);
  margin-top: 8px;
}

.button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 62px;
  padding: 16px 20px;
  border: 2px solid var(--orange);
  border-radius: 0;
  color: var(--cream);
  font: 900 16px "Courier New", monospace;
  letter-spacing: 2px;
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s, background .2s, color .2s;
}

.button:hover {
  transform: translateY(-3px);
}

.buy {
  background: var(--orange);
  color: #202619;
  box-shadow: 5px 5px 0 rgba(35, 42, 24, .4);
}

.buy:hover {
  background: var(--cream);
  border-color: var(--cream);
}

.later {
  background: transparent;
  color: white;
  font-size: 12px;
  letter-spacing: 1px;
}

.later:hover {
  background: var(--orange);
  color: var(--dark);
}

.footer {
  margin-top: 24px;
  color: var(--dark);
  font-size: 9px;
  letter-spacing: 2px;
}

.toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 24px;
  width: max-content;
  max-width: calc(100% - 32px);
  padding: 14px 18px;
  border: 1px solid var(--orange);
  background: #252b1e;
  color: var(--cream);
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: .25s;
}

.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

@media (max-height: 700px) {
  .terminal { padding-top: 40px; padding-bottom: 20px; }
  .character-stage { height: 34vh; min-height: 210px; }
  h1 { margin-top: 20px; }
  .footer { margin-top: 15px; }
}

@media (max-width: 480px) {
  .topline { left: 14px; right: 14px; font-size: 9px; }
  .character-stage { height: 38vh; min-height: 260px; }
  .subtitle { font-size: 9px; letter-spacing: 2px; }
  .button { min-height: 58px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<main class="terminal">

  <div class="topline">
    <span>FROGINALS // F-01</span>
    <span class="status">SYSTEM ONLINE</span>
  </div>

  <h1>FROGINALVERSE</h1>
  <p class="subtitle">RECRUITMENT TERMINAL</p>

  <div class="character-stage">
    <img
      class="frog"
      src="https://raw.githubusercontent.com/Obideft/froginals/main/images/recrute/froginal_Army_front.png"
      alt="Froginal Army recruit standing in a front-facing T-pose"
      onerror="this.style.opacity='.15'; this.alt='Frog image could not load. Check the GitHub image path.';"
    >
  </div>

  <div class="actions">
    <a
      class="button buy"
      href="https://gravemint.io/mint/3678jb"
      target="_blank"
      rel="noopener noreferrer"
    >
      BUY NFT &nbsp; ↗
    </a>

    <button class="button later" id="laterButton" type="button">
      NO, NOW RECRUIT ME LATER
    </button>
  </div>

  <div class="footer">
    YOUR FROG. YOUR SQUAD. YOUR MISSION.
  </div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const laterButton = document.getElementById("laterButton");
const toast = document.getElementById("toast");
let toastTimeout;

laterButton.addEventListener("click", () => {
  toast.textContent =
    "RECRUITMENT POSTPONED. THE COMMANDER WILL BE WAITING, SOLDIER.";
  toast.classList.add("show");

  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove("show");
  }, 3200);
});
</script>
</body>
</html>
