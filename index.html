
<script>
  const music = document.getElementById("backgroundMusic");
  const toggle = document.getElementById("musicToggle");

  toggle.addEventListener("click", async () => {
    if (music.paused) {
      try {
        await music.play();

        toggle.classList.remove("is-muted");
        toggle.setAttribute("aria-pressed", "true");
        toggle.setAttribute("aria-label", "Mute background music");
        toggle.title = "Mute background music";
      } catch (error) {
        console.error("Unable to play background music:", error);
        toggle.classList.add("is-muted");
        toggle.setAttribute("aria-pressed", "false");
        toggle.setAttribute("aria-label", "Music unavailable");
        toggle.title = "Music unavailable — check the audio file path";
      }
    } else {
      music.pause();
      music.currentTime = 0;

      toggle.classList.add("is-muted");
      toggle.setAttribute("aria-pressed", "false");
      toggle.setAttribute("aria-label", "Play background music");
      toggle.title = "Play background music";
    }
  });
</script>
</body>
</html>
